<!-- V2.1 -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleSavings">Fin Flow FPR - Objetivos de Ahorro</title>

    <script src="../js/inactividad.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.7);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- NAVBAR TOP -->
    <header class="bg-[#1e293b]/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-40 px-4 py-2.5 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="bg-slate-700/50 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl transition border border-slate-600/50 flex items-center justify-center">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bullseye text-amber-400 text-lg sm:text-2xl"></i>
                <h1 class="text-sm sm:text-xl font-bold tracking-wide text-white whitespace-nowrap" data-i18n="savingsTitle">
                    Objetivos de Ahorro 
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-xl text-xs sm:text-sm text-slate-300 flex items-center gap-2 shadow-inner">
                <i class="fa-solid fa-user text-emerald-400"></i>
                <span id="userEmailDisplay" class="hidden sm:inline">Cargando...</span>
            </div>
            <button onclick="logoutUser()" class="bg-slate-700/50 hover:bg-rose-600/80 hover:text-white text-slate-300 p-2 rounded-xl transition border border-slate-600/50 flex items-center justify-center" data-i18n-title="logout" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket text-base"></i>
            </button>
        </div>
    </header>

    <!-- PANEL DESLIZANTE (SIDEBAR OVERLAY) -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="sidebar" aria-label="Menu principal" class="fixed top-0 left-0 h-full w-[85vw] sm:w-80 max-w-xs bg-slate-900/95 backdrop-blur-2xl border-r border-slate-800/90 z-50 -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-[0_25px_60px_rgba(0,_0,_0,_0.65)] overflow-hidden">
    
        <!-- Detalle luminoso superior + resplandores ambientales (acento ámbar para Objetivos de Ahorro) -->
        <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-amber-400/60 to-transparent z-20"></div>
        <div class="absolute -left-10 -top-10 w-36 h-36 rounded-full bg-amber-500/10 blur-2xl pointer-events-none"></div>
        <div class="absolute -right-10 bottom-16 w-36 h-36 rounded-full bg-yellow-500/10 blur-2xl pointer-events-none"></div>

        <!-- Header del Sidebar -->
        <div class="relative z-10 flex items-center justify-between p-4 border-b border-slate-800/80 bg-slate-950/40 shrink-0">
            <div class="flex items-center gap-3">
                <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner shrink-0">
                    <i class="fa-solid fa-wallet text-base"></i>
                </span>
                <div>
                    <span class="font-bold text-base sm:text-lg text-white tracking-tight block leading-none" data-i18n="modules">Módulos</span>
                    <span class="text-[15px] font-medium text-slate-400 tracking-wide">Fin Flow</span>
                </div>
            </div>
            <button type="button" onclick="toggleSidebar()" aria-label="Cerrar menú" class="w-9 h-9 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 text-slate-400 hover:text-white flex items-center justify-center transition-all active:scale-95 cursor-pointer">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <!-- Navegación Principal -->
        <nav class="relative z-10 p-3 sm:p-4 space-y-1.5 overflow-y-auto flex-1 custom-scroll">
            
            <a href="../index.html" onclick="toggleSidebar()" class="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:text-white bg-transparent hover:bg-slate-800/60 border border-transparent hover:border-slate-700/60 transition-all">
                <span class="w-8 h-8 rounded-lg bg-slate-950/60 border border-slate-800 group-hover:border-emerald-500/30 group-hover:bg-emerald-500/10 flex items-center justify-center text-emerald-400 transition-colors shrink-0">
                    <i class="fa-solid fa-house text-xs"></i>
                </span>
                <span class="text-sm font-medium" data-i18n="dashboardMain">Dashboard Principal</span>
            </a>
            
            <!-- Categoría: Gestión Avanzada -->
            <div class="pt-4 pb-1 px-2 flex items-center gap-2">
                <p class="text-[10px] uppercase font-bold tracking-widest text-slate-500">
                    Gestión Avanzada
                </p>
                <div class="h-[1px] flex-1 bg-slate-800/80"></div>
            </div>

            <a href="../CuentasCarteras/CuentasCarteras.html" onclick="toggleSidebar()" class="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:text-white bg-transparent hover:bg-slate-800/60 border border-transparent hover:border-slate-700/60 transition-all">
                <span class="w-8 h-8 rounded-lg bg-slate-950/60 border border-slate-800 group-hover:border-purple-500/30 group-hover:bg-purple-500/10 flex items-center justify-center text-purple-400 transition-colors shrink-0">
                    <i class="fa-solid fa-wallet text-xs"></i>
                </span>
                <span class="text-sm font-medium" data-i18n="walletsTitle">Cuentas Carteras</span>
            </a>

            <!-- Item Activo: Objetivos de Ahorro (Amber) -->
            <a href="objetivosAhorros.html" onclick="toggleSidebar()" class="group relative overflow-hidden flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-white bg-gradient-to-r from-amber-500/20 to-yellow-500/5 border border-amber-500/30 font-semibold shadow-sm transition-all">
                <span class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
                    <i class="fa-solid fa-bullseye text-xs"></i>
                </span>
                <span class="text-sm tracking-tight flex-1" data-i18n="savingsTitle">Objetivos de Ahorro</span>
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.85)]"></span>
            </a>
            
            <a href="../GastosDiarios/GastosDiarios.html" onclick="toggleSidebar()" class="group flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:text-white bg-transparent hover:bg-slate-800/60 border border-transparent hover:border-slate-700/60 transition-all">
                <span class="w-8 h-8 rounded-lg bg-slate-950/60 border border-slate-800 group-hover:border-blue-500/30 group-hover:bg-blue-500/10 flex items-center justify-center text-blue-400 transition-colors shrink-0">
                    <i class="fa-solid fa-receipt text-xs"></i>
                </span>
                <span class="text-sm font-medium" data-i18n="dailyExpensesTitle">Gastos Diarios</span>
            </a>

            <!-- Categoría: Ajustes -->
            <div class="pt-4 pb-1 px-2 flex items-center gap-2">
                <p class="text-[10px] uppercase font-bold tracking-widest text-slate-500" data-i18n="settingsTitle">Ajustes</p>
                <div class="h-[1px] flex-1 bg-slate-800/80"></div>
            </div>

            <button type="button" onclick="window.location.href='../pages/Ajustes.html'" class="group w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-300 hover:text-white bg-transparent hover:bg-slate-800/60 border border-transparent hover:border-slate-700/60 transition-all text-left cursor-pointer">
                <span class="w-8 h-8 rounded-lg bg-slate-950/60 border border-slate-800 group-hover:border-slate-600 group-hover:bg-slate-800 flex items-center justify-center text-slate-400 group-hover:text-white transition-colors shrink-0">
                    <i class="fa-solid fa-gear text-xs group-hover:rotate-45 transition-transform duration-300"></i>
                </span>
                <span class="text-sm font-medium" data-i18n="appSettings">Configuración de App</span>
            </button>

        </nav>

        <!-- Footer del Sidebar -->
        <div class="relative z-10 p-3.5 sm:p-4 border-t border-slate-800/80 bg-slate-950/50 shrink-0">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="font-medium flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span data-i18n="appVersion">Versión App</span>
                </span>
                <span class="font-bold tabular-nums text-emerald-300 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20">
                    v7.0
                </span>
            </div>
        </div>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6 flex-1">
        
        <section class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-4 sm:p-6 rounded-2xl border border-slate-800/90 shadow-[0_20px_50px_rgba(245,_158,_11,_0.08)] space-y-6">
    
            <!-- Detalle luminoso superior + brillo ambiental -->
            <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-amber-400/60 to-transparent"></div>
            <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-amber-500/10 blur-2xl pointer-events-none"></div>

            <!-- Header principal con badge decorativo -->
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500/20 to-yellow-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-inner shrink-0">
                        <i class="fa-solid fa-bullseye text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-white leading-tight tracking-tight" data-i18n="savingsTitle">
                            Objetivos de Ahorro
                        </h2>
                        <p class="text-xs text-slate-400" data-i18n="savingsSync">Sincronizado con Firebase Firestore</p>
                    </div>
                </div>
                <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-amber-300 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full hidden sm:inline-flex">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span data-i18n="savingsBadge">Metas Financieras</span>
                </span>
            </div>

            <!-- Formulario (Mismas columnas y tamaños originales) -->
            <form id="savingsGoalForm" onsubmit="createNewSavingsGoal(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3.5 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800/80">
                
                <!-- Nombre del Objetivo (sm:col-span-4) -->
                <div class="sm:col-span-4">
                    <label for="goalTitle" class="block text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1.5" data-i18n="goalNameLabel">Nombre del Objetivo</label>
                    <input type="text" id="goalTitle" placeholder="Ej. KTM HARD ENDURO" required 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all">
                </div>

                <!-- Monto Meta ($) (sm:col-span-3) -->
                <div class="sm:col-span-3">
                    <label for="goalTargetAmount" class="block text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1.5" data-i18n="goalTargetLabel">Monto Meta ($)</label>
                    <input type="number" id="goalTargetAmount" placeholder="70000.00" step="0.01" min="1" required 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-amber-300 tabular-nums placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all">
                </div>

                <!-- Foto de la Meta (sm:col-span-3) -->
                <div class="sm:col-span-3">
                    <label for="goalImageInput" class="block text-[11px] uppercase tracking-wider font-bold text-slate-400 mb-1.5" data-i18n="goalPhotoLabel">Foto de la Meta</label>
                    <input type="file" id="goalImageInput" accept="image/*" 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl p-1 text-xs text-slate-400 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-lg file:border file:border-amber-500/30 file:text-xs file:font-semibold file:bg-amber-500/15 file:text-amber-300 hover:file:bg-amber-500/25 file:transition-colors cursor-pointer min-h-[42px]">
                </div>

                <!-- Botón Crear Meta (sm:col-span-2) -->
                <div class="sm:col-span-2 flex items-end">
                    <button type="submit" id="submitGoalBtn" 
                        class="w-full h-[42px] bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 active:scale-[0.98] text-slate-950 font-bold px-2.5 rounded-xl text-xs transition-all duration-200 flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/25 hover:shadow-amber-400/40 cursor-pointer whitespace-nowrap">
                        <i class="fa-solid fa-plus-circle text-sm shrink-0"></i>
                        <span data-i18n="goalCreateBtn">Crear Meta</span>
                    </button>
                </div>
            </form>

            <!-- Lista Dinámica de Metas -->
            <div class="pt-2">
                <h3 class="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span data-i18n="activeGoals">Mis Metas Activas</span>
                </h3>
                
                <div id="savingsGoalsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 max-h-[600px] overflow-y-auto pr-1 custom-scroll">
                    <!-- Se renderiza mediante JS/Firebase -->
                </div>
            </div>

        </section>

    </main>

    <!-- MODAL REGISTRO APORTES/RETIROS -->
    <div id="savingsMovementModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3.5 z-50 overflow-y-auto">
        <div class="relative overflow-hidden bg-slate-900/95 backdrop-blur-2xl rounded-2xl max-w-md w-full p-5 sm:p-6 border border-slate-800/90 shadow-[0_25px_60px_rgba(245,_158,_11,_0.14)] space-y-4 my-auto">
            
            <!-- Detalle luminoso superior + brillo ambiental -->
            <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-amber-400/60 to-transparent"></div>
            <div class="absolute -right-8 -top-8 w-28 h-28 rounded-full bg-amber-500/10 blur-2xl pointer-events-none"></div>

            <!-- Header del Modal -->
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3.5 relative z-10">
                <h3 class="text-base sm:text-lg font-bold text-white tracking-tight flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-500/20 to-yellow-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-inner shrink-0">
                        <i class="fa-solid fa-coins text-sm"></i>
                    </span>
                    <span data-i18n="savingsMovementTitle">Registrar Movimiento</span>
                </h3>
                <button type="button" onclick="closeSavingsModal()" class="w-8 h-8 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 text-slate-400 hover:text-white flex items-center justify-center transition-all cursor-pointer">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- Formulario del Modal -->
            <form id="savingsMovementForm" onsubmit="processSavingsMovement(event)" class="space-y-3 bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 relative z-10">
                <input type="hidden" id="modalBoxId">

                <!-- Tipo de Operación -->
                <div>
                    <label for="modalActionType" class="text-[11px] text-slate-400 uppercase tracking-wider font-bold mb-1.5 block" data-i18n="operationType">Tipo de Operación</label>
                    <div class="relative">
                        <select id="modalActionType" class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl pl-3.5 pr-9 py-2.5 text-sm font-medium text-slate-100 focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 focus:outline-none transition-all appearance-none cursor-pointer min-h-[42px]">
                            <option value="add" data-i18n="savingsAdd">Abonar a la Meta (+)</option>
                            <option value="subtract" data-i18n="savingsWithdraw">Retirar Fondos (-)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Origen / Destino del Dinero -->
                <div>
                    <label for="modalSource" class="text-[11px] text-slate-400 uppercase tracking-wider font-bold mb-1.5 block" data-i18n="moneySource">Origen / Destino del Dinero</label>
                    <div class="relative">
                        <select id="modalSource" class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl pl-3.5 pr-9 py-2.5 text-sm font-medium text-slate-100 focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 focus:outline-none transition-all appearance-none cursor-pointer min-h-[42px]">
                            <option value="Efectivo" data-i18n="cash">💵 Efectivo</option>
                            <option value="Cuenta/Banco" data-i18n="bankAccount">🏦 Cuenta de Banco / Tarjeta</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Monto ($) -->
                <div>
                    <label for="modalAmount" class="text-[11px] text-slate-400 uppercase tracking-wider font-bold mb-1.5 block" data-i18n="amount">Monto ($)</label>
                    <input type="number" id="modalAmount" step="0.01" min="0.01" required placeholder="0.00" 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-amber-300 tabular-nums placeholder-slate-500 focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 focus:outline-none transition-all min-h-[42px]">
                </div>

                <!-- Fecha -->
                <div>
                    <label for="modalDate" class="text-[11px] text-slate-400 uppercase tracking-wider font-bold mb-1.5 block" data-i18n="thDate">Fecha</label>
                    <input type="date" id="modalDate" required 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-2.5 py-1 text-sm text-slate-100 focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 focus:outline-none transition-all scheme-dark min-h-[42px]">
                </div>

                <!-- Nota / Descripción -->
                <div>
                    <label for="modalReason" class="text-[11px] text-slate-400 uppercase tracking-wider font-bold mb-1.5 block" data-i18n="goalNoteLabel">Nota / Descripción</label>
                    <input type="text" id="modalReason" required data-i18n-placeholder="goalNotePlaceholder" placeholder="Ej. Ahorro quincenal" 
                        class="w-full bg-slate-900/90 border border-slate-700/70 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 focus:outline-none transition-all min-h-[42px]">
                </div>

                <!-- Botón Guardar -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full h-[42px] bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 active:scale-[0.98] text-slate-950 font-bold px-4 rounded-xl text-sm transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-amber-500/25 hover:shadow-amber-400/40 cursor-pointer whitespace-nowrap">
                        <i class="fa-solid fa-check-circle text-sm shrink-0"></i>
                        <span data-i18n="saveBtn">Guardar Movimiento</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/logger.js"></script>
    <script type="module" src="../config/firebase.js"></script>

    <!-- Script del Módulo de Ahorros -->
    <script src="../js/settings-global.js"></script>
    <script src="scriptObjetivos.js"></script>
</body>
</html>
