<!-- V2.0-->
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title data-i18n="pageTitleSettings">Ajustes | Fin Flow FPR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .settings-card {
            background-color: #1e293b;
            border-color: #334155;
        }

        .settings-control {
            background-color: #0f172a;
            border-color: #475569;
            color: #f1f5f9;
        }

        body.theme-light {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .theme-light nav {
            background-color: #fff;
            border-color: #cbd5e1;
        }

        .theme-light nav span,
        .theme-light main > header h1 {
            color: #0f172a;
        }

        .theme-light main > header p {
            color: #475569;
        }

        .theme-light .settings-card {
            background-color: #fff;
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .theme-light .settings-card h1,
        .theme-light .settings-card h2,
        .theme-light .settings-card p,
        .theme-light .settings-card label {
            color: #334155;
        }

        .theme-light .settings-control {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 transition-colors duration-300" id="mainBody">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-wallet text-emerald-400"></i>
            <span class="font-bold text-sm tracking-tight">Fin Flow FPR</span>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-6 md:py-10">
        <header class="mb-6 md:mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-white" data-i18n="txtTitle">Ajustes</h1>
            <p class="text-sm md:text-base text-slate-400" data-i18n="descTitle">Personaliza tu experiencia en Fin Flow FPR.</p>
        </header>

        <div class="space-y-4 md:space-y-6">
            <!-- Seccion de Apariencia -->
            <section class="settings-card relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-5 md:p-6 rounded-2xl border border-slate-800/90 shadow-[0_20px_50px_rgba(16,_185,_129,_0.08)] space-y-5 transition-all">
    
                <!-- Detalle luminoso superior + brillo ambiental -->
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-400/60 to-transparent"></div>
                <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-emerald-500/10 blur-2xl pointer-events-none"></div>

                <!-- Header de la Sección -->
                <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 relative z-10">
                    <h2 class="text-base md:text-lg font-bold text-white tracking-tight flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner shrink-0">
                            <i class="fa-solid fa-eye text-sm"></i>
                        </span>
                        <span data-i18n="label_apariencia">Apariencia</span>
                    </h2>
                    <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Interfaz
                    </span>
                </div>

                <!-- Controles de Configuración -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 relative z-10">
                    
                    <!-- Selector: Tema visual -->
                    <div>
                        <label for="selectTema" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_tema">
                            Tema visual
                        </label>
                        <div class="relative group">
                            <i class="fa-solid fa-circle-half-stroke absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 group-focus-within:text-emerald-300 text-xs pointer-events-none transition-colors"></i>
                            <select id="selectTema" 
                                class="settings-control w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-700/70 hover:border-slate-600 rounded-xl pl-9 pr-9 py-2.5 text-sm font-medium text-slate-100 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all appearance-none cursor-pointer min-h-[44px]">
                                <option value="claro" data-i18n="lightTheme">Modo claro</option>
                                <option value="oscuro" data-i18n="darkTheme">Modo oscuro</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400 group-hover:text-slate-200 transition-colors">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Selector: Tamaño de letra -->
                    <div>
                        <label for="selectFuente" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_fuente">
                            Tamaño de letra
                        </label>
                        <div class="relative group">
                            <i class="fa-solid fa-text-height absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 group-focus-within:text-emerald-300 text-xs pointer-events-none transition-colors"></i>
                            <select id="selectFuente" 
                                class="settings-control w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-700/70 hover:border-slate-600 rounded-xl pl-9 pr-9 py-2.5 text-sm font-medium text-slate-100 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all appearance-none cursor-pointer min-h-[44px]">
                                <option value="f-sm" data-i18n="smallFont">Pequeña</option>
                                <option value="f-base" data-i18n="normalFont" selected>Normal</option>
                                <option value="f-lg" data-i18n="largeFont">Grande</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400 group-hover:text-slate-200 transition-colors">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Seccion de preferencias -->
            <section class="settings-card relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-5 md:p-6 rounded-2xl border border-slate-800/90 shadow-[0_20px_50px_rgba(16,_185,_129,_0.08)] space-y-5 transition-all">
    
                <!-- Detalle luminoso superior + brillo ambiental -->
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-400/60 to-transparent"></div>
                <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-emerald-500/10 blur-2xl pointer-events-none"></div>

                <!-- Header de la Sección -->
                <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 relative z-10">
                    <h2 class="text-base md:text-lg font-bold text-white tracking-tight flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner shrink-0">
                            <i class="fa-solid fa-sliders text-sm"></i>
                        </span>
                        <span data-i18n="label_preferencias">Preferencias</span>
                    </h2>
                    <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Regional
                    </span>
                </div>

                <!-- Controles de Configuración -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 relative z-10">
                    
                    <!-- Selector: Idioma -->
                    <div>
                        <label for="selectorIdioma" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_idioma">
                            Idioma
                        </label>
                        <div class="relative group">
                            <i class="fa-solid fa-globe absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 group-focus-within:text-emerald-300 text-xs pointer-events-none transition-colors"></i>
                            <select id="selectorIdioma" 
                                class="settings-control w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-700/70 hover:border-slate-600 rounded-xl pl-9 pr-9 py-2.5 text-sm font-medium text-slate-100 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all appearance-none cursor-pointer min-h-[44px]">
                                <option value="es">Español</option>
                                <option value="en">English</option>
                                <option value="fr">Français</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400 group-hover:text-slate-200 transition-colors">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Selector: Moneda -->
                    <div>
                        <label for="selectorMoneda" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" data-i18n="label_moneda">
                            Moneda
                        </label>
                        <div class="relative group">
                            <i class="fa-solid fa-coins absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400 group-focus-within:text-emerald-300 text-xs pointer-events-none transition-colors"></i>
                            <select id="selectorMoneda" 
                                class="settings-control w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-700/70 hover:border-slate-600 rounded-xl pl-9 pr-9 py-2.5 text-sm font-medium text-slate-100 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all appearance-none cursor-pointer min-h-[44px]">
                                <option value="$" data-i18n="dollar">Dólar ($)</option>
                                <option value="€" data-i18n="euro">Euro (€)</option>
                                <option value="Q" data-i18n="quetzal">Quetzal (Q)</option>
                                <option value="£" data-i18n="pound">Libra (£)</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400 group-hover:text-slate-200 transition-colors">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Seccion de comentarios -->
            <section class="settings-card relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-5 md:p-6 rounded-2xl border border-slate-800/90 shadow-[0_20px_50px_rgba(16,_185,_129,_0.08)] space-y-5 transition-all">
    
                <!-- Detalle luminoso superior + brillo ambiental -->
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-400/60 to-transparent"></div>
                <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-emerald-500/10 blur-2xl pointer-events-none"></div>

                <!-- Header de la Sección -->
                <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 relative z-10">
                    <h2 class="text-base md:text-lg font-bold text-white tracking-tight flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner shrink-0">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </span>
                        <span data-i18n="label_feedback">Enviar comentarios</span>
                    </h2>
                    <span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Soporte & Mejoras
                    </span>
                </div>

                <!-- Formulario de Comentarios -->
                <form id="feedbackForm" class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 space-y-3 relative z-10">
                    <div>
                        <label for="feedbackText" class="sr-only" data-i18n="label_feedback_input">Tu sugerencia</label>
                        <textarea id="feedbackText" required maxlength="2000" data-i18n-placeholder="ph_feedback" placeholder="¿Tienes alguna idea?" 
                            class="settings-control w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-700/70 hover:border-slate-600 p-4 rounded-xl h-28 md:h-32 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all resize-y custom-scroll"></textarea>
                    </div>

                    <p class="text-xs text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-info text-emerald-400/80 text-[11px] shrink-0"></i>
                        <span data-i18n="feedback_note">La sugerencia se guardará.</span>
                    </p>

                    <div id="feedbackStatus" class="hidden rounded-xl p-3 text-sm" role="status" aria-live="polite"></div>

                    <div class="pt-1 flex justify-end sm:justify-start">
                        <button id="feedbackSubmit" type="submit" 
                            class="w-full sm:w-auto h-[44px] bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 active:scale-[0.98] disabled:opacity-60 disabled:pointer-events-none text-slate-950 px-6 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-400/40 cursor-pointer whitespace-nowrap">
                            <i class="fa-solid fa-paper-plane text-xs shrink-0"></i>
                            <span data-i18n="btn_feedback">Enviar sugerencia</span>
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <button id="backBtn" class="mt-8 inline-flex items-center gap-2 text-emerald-400 font-semibold hover:text-emerald-300 transition-all text-sm">
            <i class="fa-solid fa-arrow-left"></i>
            <span data-i18n="btn_volver_dashboard">Volver</span>
        </button>
        
    </main>

    <script src="../js/logger.js"></script>
    <script src="../js/settings-global.js"></script>
    <script type="module" src="../js/scriptAjustes.js"></script>
    

</body>
</html>
