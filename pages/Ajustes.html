<!-- V2.0-->
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title data-i18n="pageTitleSettings">Ajustes | Fin Flow FPR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .settings-card {
            background-color: #1e293b;
            border-color: #334155;
        }

        .settings-control {
            background-color: #0f172a;
            border-color: #475569;
            color: #f1f5f9;
        }

        body.theme-light {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .theme-light nav {
            background-color: #fff;
            border-color: #cbd5e1;
        }

        .theme-light nav span,
        .theme-light main > header h1 {
            color: #0f172a;
        }

        .theme-light main > header p {
            color: #475569;
        }

        .theme-light .settings-card {
            background-color: #fff;
            border-color: #cbd5e1;
            color: #1e293b;
        }

        .theme-light .settings-card h1,
        .theme-light .settings-card h2,
        .theme-light .settings-card p,
        .theme-light .settings-card label {
            color: #334155;
        }

        .theme-light .settings-control {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
        }

        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 transition-colors duration-300" id="mainBody">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-wallet text-emerald-400"></i>
            <span class="font-bold text-sm tracking-tight">Fin Flow FPR</span>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-6 md:py-10">
        <header class="mb-6 md:mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-white" data-i18n="txtTitle">Ajustes</h1>
            <p class="text-sm md:text-base text-slate-400" data-i18n="descTitle">Personaliza tu experiencia en Fin Flow FPR.</p>
        </header>

        <div class="space-y-4 md:space-y-6">
            <section class="settings-card p-5 md:p-6 rounded-2xl shadow border transition-all">
                <h2 class="text-md md:text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-eye text-emerald-400"></i>
                    <span data-i18n="label_apariencia">Apariencia</span>
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="selectTema" class="block text-xs font-semibold text-slate-400 uppercase mb-2" data-i18n="label_tema">Tema visual</label>
                        <select id="selectTema" class="settings-control w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <option value="claro" data-i18n="lightTheme">Modo claro</option>
                            <option value="oscuro" data-i18n="darkTheme">Modo oscuro</option>
                        </select>
                    </div>
                    <div>
                        <label for="selectFuente" class="block text-xs font-semibold text-slate-400 uppercase mb-2" data-i18n="label_fuente">Tamaño de letra</label>
                        <select id="selectFuente" class="settings-control w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <option value="f-sm" data-i18n="smallFont">Pequeña</option>
                            <option value="f-base" data-i18n="normalFont" selected>Normal</option>
                            <option value="f-lg" data-i18n="largeFont">Grande</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="settings-card p-5 md:p-6 rounded-2xl shadow border">
                <h2 class="text-md md:text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-400"></i>
                    <span data-i18n="label_preferencias">Preferencias</span>
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="selectorIdioma" class="block text-xs font-semibold text-slate-400 uppercase mb-2" data-i18n="label_idioma">Idioma</label>
                        <select id="selectorIdioma" class="settings-control w-full border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <option value="es">Español</option>
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                    <div>
                        <label for="selectorMoneda" class="block text-xs font-semibold text-slate-400 uppercase mb-2" data-i18n="label_moneda">Moneda</label>
                        <select id="selectorMoneda" class="settings-control w-full border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                            <option value="$" data-i18n="dollar">Dólar ($)</option>
                            <option value="€" data-i18n="euro">Euro (€)</option>
                            <option value="Q" data-i18n="quetzal">Quetzal (Q)</option>
                            <option value="£" data-i18n="pound">Libra (£)</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="settings-card p-5 md:p-6 rounded-2xl shadow border">
                <h2 class="text-md md:text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane text-emerald-400"></i>
                    <span data-i18n="label_feedback">Enviar comentarios</span>
                </h2>
                <form id="feedbackForm">
                    <label for="feedbackText" class="sr-only" data-i18n="label_feedback_input">Tu sugerencia</label>
                    <textarea id="feedbackText" required maxlength="2000" data-i18n-placeholder="ph_feedback" placeholder="¿Tienes alguna idea?" class="settings-control w-full border p-4 rounded-xl h-28 md:h-32 outline-none focus:ring-2 focus:ring-emerald-500 transition-all"></textarea>
                    <p class="text-xs text-slate-400 mt-2" data-i18n="feedback_note">La sugerencia se guardará en tu perfil de Firebase.</p>
                    <div id="feedbackStatus" class="hidden mt-3 rounded-lg p-3 text-sm" role="status" aria-live="polite"></div>
                    <button id="feedbackSubmit" type="submit" class="mt-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-900/10">
                        <i class="fa-solid fa-paper-plane mr-2"></i><span data-i18n="btn_feedback">Enviar sugerencia</span>
                    </button>
                </form>
            </section>
        </div>

        <button id="backBtn" class="mt-8 inline-flex items-center gap-2 text-emerald-400 font-semibold hover:text-emerald-300 transition-all text-sm">
            <i class="fa-solid fa-arrow-left"></i>
            <span data-i18n="btn_volver_dashboard">Volver</span>
        </button>
        
    </main>

    <script src="../js/settings-global.js"></script>
    <script type="module" src="../js/scriptAjustes.js"></script>
    

</body>
</html>
