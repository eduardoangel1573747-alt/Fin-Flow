<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="pageTitleHistory">Historial Global - Fin Flow FPR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between antialiased selection:bg-purple-500 selection:text-white">

    <!-- NAVBAR NAVEGACIÓN -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-purple-600 to-indigo-500 p-2 rounded-xl text-white shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-clock-rotate-left text-lg sm:text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent" data-i18n="histPageTitleHD">
                        Historial de Transacciones
                    </h1>
                    <p class="text-[10px] sm:text-xs text-slate-400 hidden sm:block" data-i18n="histPageSubHD">Registro consolidado de todos los movimientos</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <a href="index.html" class="bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold px-3 py-2 rounded-lg border border-slate-600/80 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden xs:inline" data-i18n="backBtn">Volver al Panel</span>
                </a>
                <button onclick="window.location.href='pages/Ajustes.html'" class="bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold p-2.5 rounded-lg border border-slate-600/80 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

        <!-- RESUMEN EN TARJETAS -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
    
            <!-- 1. Ingresos del Mes (Emerald) -->
            <div class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-3.5 sm:p-4 rounded-2xl border border-slate-800 shadow-[0_10px_30px_rgba(16,_185,_129,_0.07)] hover:border-emerald-500/30 transition-all duration-200 flex flex-col justify-between">
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent"></div>
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="w-6 h-6 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
                        <i class="fa-solid fa-arrow-trend-up text-[11px] sm:text-xs"></i>
                    </span>
                    <div class="text-[11px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider truncate" data-i18n="histInc">Ingresos del Mes</div>
                </div>
                <div id="histMonthIncome" class="text-base sm:text-2xl font-bold text-emerald-400 tracking-tight mt-0.5 truncate">$0.00</div>
            </div>

            <!-- 2. Gastos del Mes (Rose) -->
            <div class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-3.5 sm:p-4 rounded-2xl border border-slate-800 shadow-[0_10px_30px_rgba(244,_63,_94,_0.07)] hover:border-rose-500/30 transition-all duration-200 flex flex-col justify-between">
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-rose-500/50 to-transparent"></div>
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="w-6 h-6 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shrink-0">
                        <i class="fa-solid fa-arrow-trend-down text-[11px] sm:text-xs"></i>
                    </span>
                    <div class="text-[11px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider truncate" data-i18n="histExp">Gastos del Mes</div>
                </div>
                <div id="histMonthExpense" class="text-base sm:text-2xl font-bold text-rose-400 tracking-tight mt-0.5 truncate">$0.00</div>
            </div>

            <!-- 3. Cobros Recibidos (Cyan) -->
            <div class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-3.5 sm:p-4 rounded-2xl border border-slate-800 shadow-[0_10px_30px_rgba(6,_182,_212,_0.07)] hover:border-cyan-500/30 transition-all duration-200 flex flex-col justify-between">
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="w-6 h-6 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 shrink-0">
                        <i class="fa-solid fa-hand-holding-dollar text-[11px] sm:text-xs"></i>
                    </span>
                    <div class="text-[11px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider truncate" data-i18n="histRec">Cobros Recibidos</div>
                </div>
                <div id="histMonthReceivables" class="text-base sm:text-2xl font-bold text-cyan-400 tracking-tight mt-0.5 truncate">$0.00</div>
            </div>

            <!-- 4. Deudas Pagadas (Purple) -->
            <div class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl p-3.5 sm:p-4 rounded-2xl border border-slate-800 shadow-[0_10px_30px_rgba(168,_85,_247,_0.07)] hover:border-purple-500/30 transition-all duration-200 flex flex-col justify-between">
                <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-purple-500/50 to-transparent"></div>
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="w-6 h-6 rounded-lg bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 shrink-0">
                        <i class="fa-solid fa-circle-check text-[11px] sm:text-xs"></i>
                    </span>
                    <div class="text-[11px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider truncate" data-i18n="histDebts">Deudas Pagadas</div>
                </div>
                <div id="histMonthDebts" class="text-base sm:text-2xl font-bold text-purple-400 tracking-tight mt-0.5 truncate">$0.00</div>
            </div>

        </section>

        <!-- FILTROS DE BÚSQUEDA -->
        <section class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl border border-slate-800 p-4 rounded-2xl shadow-[0_10px_30px_rgba(168,_85,_247,_0.07)] space-y-3 sm:space-y-0 sm:flex sm:items-center sm:justify-between gap-4">
    
            <!-- Detalle luminoso superior -->
            <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-purple-500/50 to-transparent"></div>

            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                
                <!-- Selector: Mes -->
                <div class="w-full sm:w-48">
                    <label for="monthSelector" class="block text-[10px] sm:text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5" data-i18n="lblMonth">
                        Seleccionar Mes
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-calendar-days absolute left-3 top-1/2 -translate-y-1/2 text-purple-400 text-xs pointer-events-none"></i>
                        <select id="monthSelector" onchange="renderHistoryPage()" 
                            class="w-full bg-slate-950/70 border border-slate-700/70 rounded-xl pl-8 pr-8 py-2 text-xs sm:text-sm font-medium text-slate-100 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all appearance-none cursor-pointer">
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-[11px]"></i>
                        </div>
                    </div>
                </div>

                <!-- Selector: Tipo de Movimiento -->
                <div class="w-full sm:w-48">
                    <label for="typeFilter" class="block text-[10px] sm:text-xs uppercase tracking-wider font-bold text-slate-400 mb-1.5" data-i18n="lblType">
                        Tipo de Movimiento
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-filter absolute left-3 top-1/2 -translate-y-1/2 text-purple-400 text-xs pointer-events-none"></i>
                        <select id="typeFilter" onchange="renderHistoryPage()" 
                            class="w-full bg-slate-950/70 border border-slate-700/70 rounded-xl pl-8 pr-8 py-2 text-xs sm:text-sm font-medium text-slate-100 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all appearance-none cursor-pointer">
                            <option value="all" data-i18n="optAll">Todos los Tipos</option>
                            <option value="expense" data-i18n="optExpenses">Gastos</option>
                            <option value="income" data-i18n="optIncomes">Ingresos Directos</option>
                            <option value="receivable_payment" data-i18n="optRecPayments">Cobros Recibidos</option>
                            <option value="debt_payment" data-i18n="optDebtPayments">Pagos de Deudas</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-[11px]"></i>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- TABLA -->
        <section class="relative overflow-hidden bg-slate-900/90 backdrop-blur-2xl border border-slate-800 rounded-2xl shadow-[0_20px_50px_rgba(168,_85,_247,_0.07)]">
    
            <!-- Detalle luminoso superior -->
            <div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-purple-500/50 to-transparent z-10"></div>

            <div class="overflow-x-auto custom-scroll">
                <table class="w-full text-left text-xs sm:text-sm border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-slate-950/70 border-b border-slate-800 text-slate-400 font-bold uppercase text-[10px] sm:text-xs tracking-wider">
                            <th class="py-3.5 px-4 whitespace-nowrap" data-i18n="thDate">Fecha</th>
                            <th class="py-3.5 px-4 whitespace-nowrap" data-i18n="thType">Tipo</th>
                            <th class="py-3.5 px-4" data-i18n="thDesc">Descripción</th>
                            <th class="py-3.5 px-4" data-i18n="thCat">Categoría / Origen</th>
                            <th class="py-3.5 px-4 text-right whitespace-nowrap" data-i18n="thAmount">Monto</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-800/60 text-slate-200 [&>tr]:transition-colors [&>tr:hover]:bg-slate-800/40">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-800/60 border-t border-slate-700/60 mt-8 py-4 text-center text-xs text-slate-400 px-4">
        <p>&copy; <span id="year"></span> Fin Flow FPR. <span data-i18n="rights">Todos los derechos reservados.</span></p>
    </footer>


    <script src="js/logger.js"></script>
    <script type="module" src="config/firebase.js"></script>
    <!-- SCRIPT CENTRALIZADO DE TRADUCCIÓN QUE HICIMOS ANTES -->
    <script type="module" src="js/settings-global.js"></script>
    <script src="js/scrip.js"></script>
    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initHistoryPage === 'function') {
                initHistoryPage();
            }
        });
    </script>
</body>
</html>
